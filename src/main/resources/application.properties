# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=rally-auth
server.port=${SERVER_PORT:8082}
spring.config.import=optional:file:.env[.properties]
# ===================================================================

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ===================================================================
# Database Configuration (PostgreSQL)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Settings
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.engine.jdbc.batch=OFF

# ===================================================================
# Flyway Migration Settings
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Apache Kafka Configuration
# ===================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer Configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Kafka Observation & Tracing Propagation
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

# ===================================================================
# Outbox Relay Configuration
# ===================================================================
outbox.relay.poll-interval-ms=${OUTBOX_RELAY_POLL_INTERVAL_MS:1000}
outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE:100}

# ===================================================================
# File Storage Configuration
# ===================================================================
app.storage.root=${STORAGE_ROOT:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===================================================================
# Application Behavior Configuration (Auth & Security)
# ===================================================================
app.auto-confirm-email=${APP_AUTO_CONFIRM_EMAIL:false}
app.email.enabled=${APP_EMAIL_ENABLED:true}
app.otp.length=${OTP_LENGTH:6}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:3}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.encryption.password=${OTP_ENCRYPTION_PASSWORD:Rally@OtpKey2026!Sec}
app.otp.encryption.salt=${OTP_ENCRYPTION_SALT:41b0bf0fbeeb24a5022dc25ead1b5009}
app.security.access-token-seconds=${ACCESS_TOKEN_SECONDS:900}
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.password.min-length=${PASSWORD_MIN_LENGTH:8}
app.password.max-length=${PASSWORD_MAX_LENGTH:64}
app.password.require-uppercase=${PASSWORD_REQUIRE_UPPERCASE:true}
app.password.require-lowercase=${PASSWORD_REQUIRE_LOWERCASE:true}
app.password.require-digit=${PASSWORD_REQUIRE_DIGIT:true}
app.password.require-special=${PASSWORD_REQUIRE_SPECIAL:true}

# JWT signing keys
app.security.jwt.private-key=${APP_SECURITY_JWT_PRIVATEKEY:}
app.security.jwt.public-key=${APP_SECURITY_JWT_PUBLICKEY:-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.rally.auth=${LOGGING_LEVEL_RALLY:DEBUG}

# ===================================================================
# Actuator & Observability & Tracing
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
management.metrics.tags.application=${spring.application.name}
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# ===================================================================
# OpenAPI / Swagger Documentation
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html