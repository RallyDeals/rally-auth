# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=rally-auth
server.port=8082

# ===================================================================
# Database Configuration (PostgreSQL on port 5433)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5436/auth_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Settings
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.engine.jdbc.batch=OFF

# ===================================================================
# Flyway Migration Settings
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Apache Kafka Configuration
# ===================================================================
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# ===================================================================
# Outbox Relay Configuration
# ===================================================================
outbox.relay.poll-interval-ms=1000
outbox.relay.batch-size=100

# ===================================================================
# Application Behavior Configuration
# ===================================================================
app.auto-confirm-email=false
app.email.enabled=true
app.otp.length=6
app.otp.expiration-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.encryption.password=${OTP_ENCRYPTION_PASSWORD:change-me}
app.otp.encryption.salt=${OTP_ENCRYPTION_SALT:change-me}
app.security.access-token-seconds=900
app.security.refresh-token-days=30
app.password.min-length=8
app.password.max-length=64
app.password.require-uppercase=true
app.password.require-lowercase=true
app.password.require-digit=true
app.password.require-special=true

# JWT signing key (dev-only, base64 of PKCS#8 DER, no PEM armor). Production
# MUST override via environment: APP_SECURITY_JWT_PRIVATEKEY.
app.security.jwt.private-
app.security.jwt.public-key=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----

# ===================================================================
# Actuator & Observability
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===================================================================
# OpenAPI / Swagger Documentation
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html