name: Build & Push to Docker Hub

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  IMAGE_NAME: medhatdh/rally-auth

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GH_USER</username>
                <password>$GH_PASS</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GH_USER: ${{ secrets.GH_PACKAGES_USERNAME }}
          GH_PASS: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build Docker image
        run: |
          ./mvnw -B spring-boot:build-image \
            -DskipTests \
            -Dspring-boot.build-image.imageName=${{ env.IMAGE_NAME }}:latest

      - name: Tag versioned image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:v${{ github.run_number }}

      - name: Push images
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:v${{ github.run_number }}
